; Supervisor: /etc/supervisor/conf.d/silakes-analyzer.conf
; Satu proses gunicorn dengan empat utas agar ringan di VPS bersama (basis data prototipe SQLite).
; Layanan berjalan di server SiLAKES sendiri, sehingga sinkronisasi membaca basis data secara lokal
; (SILAKES_SSH_HOST=lokal) dengan sesi READ ONLY yang sama.
[program:silakes-analyzer]
command=/usr/bin/nice -n 10 /var/www/analyzer.silakes.labkesdasumenep.id/.venv/bin/gunicorn --workers 1 --threads 4 --timeout 600 --bind 127.0.0.1:5065 wsgi:app
directory=/var/www/analyzer.silakes.labkesdasumenep.id
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
; XGBoost/SHAP dibatasi 2 utas agar tidak membebani sistem lain.
environment=SILAKES_SSH_HOST="lokal",OMP_NUM_THREADS="2",OPENBLAS_NUM_THREADS="2",MKL_NUM_THREADS="2",HOME="/var/www/analyzer.silakes.labkesdasumenep.id/instance"
redirect_stderr=true
stdout_logfile=/var/log/silakes-analyzer.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=620
